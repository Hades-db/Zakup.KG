name: server
on:
  push:
    paths: ['server/**', 'db/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'db/**']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: zakup }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/zakup
          TEST_DATABASE_URL: postgres://zakup_server:zakup_test@localhost:5432/zakup
