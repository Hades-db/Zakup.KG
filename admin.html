<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zakup.KG Админка</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script>
  try { var t = localStorage.getItem('zk-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Админ-панель Zakup.KG (макет). Данные в памяти, после перезагрузки всё сбрасывается. */
:root{
  --green:#16803C; --green-dark:#0F6B31; --green-hi:#22A350; --green-bg:#E6F4EA;
  --bg:#EEF2EF; --card:#FFFFFF; --soft:#F2F5F2; --line:#E4E9E5; --border:#D3DAD5;
  --text:#14201A; --muted:#58645D;
  --red:#B42318; --red-bg:#FDE8E6; --blue:#1D5FA8; --blue-bg:#E6EFFA; --amber:#9A5B00; --amber-bg:#FFF2DB;
  --side:#0B0F0D; --side-text:#C9D3CD; --side-hi:#FFFFFF; --mint:#03F48D;
  --sh:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.06);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#2FA65C; --green-dark:#24884A; --green-hi:#3DBD6C; --green-bg:#16301F;
    --bg:#0E1411; --card:#171F1A; --soft:#1F2923; --line:#26312A; --border:#34413A;
    --text:#E7EEE9; --muted:#97A59C;
    --red:#F07468; --red-bg:#3B1C19; --blue:#7FB3F0; --blue-bg:#182A3F; --amber:#F2B45A; --amber-bg:#3A2A12;
    --side:#070A08; --sh:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --green:#2FA65C; --green-dark:#24884A; --green-hi:#3DBD6C; --green-bg:#16301F;
  --bg:#0E1411; --card:#171F1A; --soft:#1F2923; --line:#26312A; --border:#34413A;
  --text:#E7EEE9; --muted:#97A59C;
  --red:#F07468; --red-bg:#3B1C19; --blue:#7FB3F0; --blue-bg:#182A3F; --amber:#F2B45A; --amber-bg:#3A2A12;
  --side:#070A08; --sh:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px} .bold{font-weight:700}
.row{display:flex;align-items:center;gap:8px} .between{display:flex;align-items:center;justify-content:space-between;gap:12px} .grow{flex:1;min-width:0}
.mono{font-variant-numeric:tabular-nums}

/* Кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:var(--green);color:#fff;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--green-dark)}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--border)} .btn.ghost:hover{background:var(--soft)}
.btn.red{background:var(--red);color:#fff} .btn.red.ghost{background:var(--card);color:var(--red);border-color:var(--border)}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:hover{background:var(--soft)}
.linkbtn{border:none;background:none;color:var(--green);font-weight:700;font-size:13px;padding:0}

/* Поля */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{height:42px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:0 12px;outline:none;width:100%}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
textarea.inp{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
select.inp{padding-right:30px}

/* Метки */
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--muted)}
.tag.green{background:var(--green-bg);color:var(--green)} .tag.red{background:var(--red-bg);color:var(--red)}
.tag.blue{background:var(--blue-bg);color:var(--blue)} .tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag .ic{width:13px;height:13px}

/* ===== Вход ===== */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:28px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:40px;height:30px;color:var(--text)}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);font-weight:700}
.login h1{font-size:22px;font-weight:800}
.code-row{display:flex;gap:8px}
.code-row input{width:100%;height:50px;text-align:center;font-size:20px;font-weight:800;border:1px solid var(--border);border-radius:10px;background:var(--card);outline:none}
.code-row input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-opt{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.role-opt b{font-size:13.5px} .role-opt span{font-size:12px;color:var(--muted)}
.role-opt.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green-bg) inset;background:var(--green-bg)}
.err{color:var(--red);font-size:13px;font-weight:600}

/* ===== Каркас ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:18px 12px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{padding:0 8px 16px}
.side .brand .mark{color:#fff} .side .brand b{color:#fff}
.nav-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6E7B73;padding:14px 10px 6px}
.nav-a{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;border:none;background:none;color:var(--side-text);font-weight:600;font-size:13.5px;text-align:left;width:100%}
.nav-a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-a.on{background:rgba(3,244,141,.12);color:#fff}
.nav-a.on .ic{color:var(--mint)}
.nav-a .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#D8392C;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.nav-a .soon{margin-left:auto;font-size:10.5px;color:#6E7B73;font-weight:700}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.me b{color:#fff;font-size:13px;display:block} .me span{font-size:12px;color:#8E9A93}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 28px 12px}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.top-search{margin-left:auto;position:relative;width:320px;max-width:40vw}
.top-search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.top-search input{padding-left:38px}
.burger{display:none}
.src{height:26px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--muted)}
.src.live{background:var(--green-bg);color:var(--green)}
.src.live:before{content:'';width:7px;height:7px;border-radius:4px;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.env{height:26px;padding:0 10px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:800;display:inline-flex;align-items:center}
.content{padding:4px 28px 40px;display:flex;flex-direction:column;gap:16px}

/* Карточки */
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:15px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:none;text-align:left}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.kpi b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.kpi i{font-style:normal;font-size:12px;font-weight:700}
.kpi i.up{color:var(--green)} .kpi i.down{color:var(--red)}
.kpi.alert{box-shadow:inset 0 0 0 1.5px var(--red),var(--sh)} .kpi.alert b{color:var(--red)}
button.kpi:hover{background:var(--soft)}

/* Вкладки-фильтры */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tab.on{background:var(--text);color:var(--card);border-color:var(--text)}
.tab .n{font-size:11.5px;opacity:.7}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .inp{height:36px;width:240px}

/* Таблицы */
.tbl-wrap{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;white-space:nowrap;background:var(--soft)}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{padding-left:18px} th:last-child,td:last-child{padding-right:18px}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)}
tr.sel{background:var(--green-bg)!important}
td.r,th.r{text-align:right}
.cell2{display:flex;flex-direction:column;gap:1px} .cell2 b{font-weight:700} .cell2 span{font-size:12px;color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* Боковая панель деталей */
.drawer-bg{position:fixed;inset:0;background:rgba(10,16,12,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:18px;font-weight:800}
.drawer-b{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sec h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list > div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.list > div:first-child{border-top:none}
.timeline{display:flex;flex-direction:column;gap:0;padding-left:6px}
.tl{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl:before{content:'';position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl:last-child:before{display:none}
.tl .dot{width:12px;height:12px;border-radius:6px;background:var(--green);margin-top:3px;flex-shrink:0;box-shadow:0 0 0 3px var(--green-bg)}
.tl .dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.tl .dot.grey{background:var(--border);box-shadow:none}
.lock{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:13px}

/* Модальное окно */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:440px;background:var(--card);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:18px;font-weight:800}

/* Обращения */
.chat{display:grid;grid-template-columns:320px 1fr;gap:0;padding:0;overflow:hidden;min-height:540px}
.t-list{border-right:1px solid var(--line);overflow-y:auto}
.t-item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.t-item:hover{background:var(--soft)} .t-item.on{background:var(--green-bg)}
.t-item b{font-size:13.5px}
.t-item .tag{align-self:flex-start}
.t-pane{display:flex;flex-direction:column;min-width:0}
.t-head{padding:14px 18px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.msg{max-width:75%;padding:10px 12px;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-size:13.5px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:4px}
.reply{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.reply .inp{height:40px}

/* Графики */
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{width:100%;max-width:42px;border-radius:8px 8px 3px 3px;background:var(--green);display:block;min-height:4px}
.bar.today i{background:var(--mint)}
.bar b{font-size:12px} .bar span{font-size:11.5px;color:var(--muted)}

/* Тех. статус */
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.svc > div{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:6px}
.sdot{width:9px;height:9px;border-radius:5px;background:var(--green);display:inline-block}
.sdot.warn{background:#E0A100} .sdot.bad{background:var(--red)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--border);border:none;position:relative;flex-shrink:0;transition:background .15s}
.switch:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]:after{transform:translateX(18px)}
.switch:disabled{opacity:.5;cursor:not-allowed}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.log .e{color:var(--red)} .log .w{color:var(--amber)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1C2420;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.2s;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ic{color:var(--mint)}

@media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .svc{grid-template-columns:repeat(2,minmax(0,1fr))} .grid3,.grid2{grid-template-columns:1fr} }
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:25;transform:translateX(-100%);transition:transform .2s}
  .app.nav-open .side{transform:none;box-shadow:10px 0 30px rgba(0,0,0,.3)}
  .burger{display:inline-flex}
  .topbar{padding:12px 16px;flex-wrap:wrap}
  .top-search{order:5;width:100%;max-width:none;margin-left:0}
  .content{padding:4px 16px 32px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chat{grid-template-columns:1fr} .t-list{max-height:220px;border-right:none;border-bottom:1px solid var(--line)}
  .kv{grid-template-columns:120px 1fr}
}
</style>
</head>

        '<div><span class="row bold"><span class="sdot"></span>Пуш-уведомления</span><span class="xs muted">FCM, доставлено 99%</span></div></div>' +
        '<div class="grid2"><div class="card"><h2>Функции</h2><div class="list">' + flags.map(([k, t, on]) => '<div><span class="grow cell2"><b>' + t + '</b><span class="mono">' + k + '</span></span><button class="switch" role="switch" data-flag="' + k + '" aria-checked="' + on + '"' + (can('flags') ? '' : ' disabled') + ' aria-label="' + t + '"></button></div>').join('') + '</div></div>' +
        '<div class="card"><div class="between"><h2>Последние ошибки</h2><span class="row"><button class="btn ghost sm" id="mk-reset">Сбросить демо-данные</button><button class="btn ghost sm" id="mk-test">' + ic('i-plus') + 'Тестовая компания</button></span></div><div class="log">' +
        '<span class="w">10:52:03 WARN sms.send timeout provider=local to=+996 500 •• •• 20</span><span class="w">10:51:40 WARN sms.send timeout provider=local to=+996 500 •• •• 20</span><span>10:40:12 INFO order.accept n=0216 deliver=23.11</span><span class="e">09:12:55 ERROR invoice.pdf render_timeout n=0214 retry=1 ok</span><span>08:55:01 INFO auth.login role=shop</span><span>03:00:00 INFO backup.done size=48MB</span>' +
        '</div></div></div>';
    },
    audit() {
      return '<div class="card"><div class="between"><h2>Журнал действий сотрудников</h2><span class="xs muted">записи нельзя изменить или удалить</span></div><div class="tbl-wrap"><table><thead><tr><th>Время</th><th>Сотрудник</th><th>Действие</th><th>Объект</th><th>Причина</th></tr></thead><tbody>' +
        audit.map(a => '<tr style="cursor:default"><td class="mono">' + a[0] + '</td><td><span class="cell2"><b>' + esc(a[1]) + '</b><span>' + esc(a[2]) + '</span></span></td><td>' + esc(a[3]) + '</td><td>' + esc(a[4]) + '</td><td class="muted">' + esc(a[5] || '') + '</td></tr>').join('') + '</tbody></table></div></div>';
    },
    staff() {
      return '<div class="card"><div class="between"><h2>Сотрудники Zakup.KG</h2><button class="btn sm" id="add-staff">' + ic('i-plus') + 'Пригласить</button></div><div class="tbl-wrap"><table><thead><tr><th>Имя</th><th>Почта</th><th>Роль</th><th>Второй фактор</th><th>Последний вход</th></tr></thead><tbody>' +
        staff.map(s => '<tr style="cursor:default"><td class="bold">' + esc(s[0]) + '</td><td>' + esc(s[1]) + '</td><td>' + ROLES[s[2]].name + '</td><td>' + tag('Включён', 'green') + '</td><td>' + s[3] + '</td></tr>').join('') + '</tbody></table></div></div>';
    }
  };
  let curTicket = 41;

  function render() {
    if (!ACCESS[page].includes(role)) page = 'home';
    $('#page-title').textContent = TITLES[page];
    $('#content').innerHTML = PAGES[page]();
    renderNav();
    const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  }

  // ---------- Клики на странице ----------
  $('#content').addEventListener('click', e => {
    const t = e.target;
    const f = t.closest('[data-f]'); if (f) { const [k, v] = f.dataset.f.split(':'); filt[k] = v; render(); return; }
    const g = t.closest('[data-goto]'); if (g) { const [p, v] = g.dataset.goto.split('-'); filt[p] = v; go(p); return; }
    const co = t.closest('[data-co]'); if (co) { openCompany(+co.dataset.co); return; }
    const o = t.closest('[data-order]'); if (o) { openOrder(o.dataset.order); return; }
    const u = t.closest('[data-user]'); if (u) { openUser(+u.dataset.user); return; }
    const tk = t.closest('[data-ticket]'); if (tk) { curTicket = +tk.dataset.ticket; render(); return; }
    const dr = t.closest('[data-dreq]'); if (dr) { openDataReq(+dr.dataset.dreq); return; }
    const hp = t.closest('[data-hide]'); if (hp && !hp.disabled) { const p = products.find(x => x.id === +hp.dataset.hide); p.hidden = !p.hidden; if (live) writeShared(d => { if (p.hidden) d.prodHidden[p.id] = true; else delete d.prodHidden[p.id]; }); logAct(p.hidden ? 'Скрыл товар' : 'Вернул товар', p.name); toast(p.hidden ? 'Товар скрыт от магазинов' : 'Товар снова виден магазинам'); render(); return; }
    const fl = t.closest('[data-flag]'); if (fl && !fl.disabled) { const x = flags.find(y => y[0] === fl.dataset.flag); x[2] = !x[2]; logAct(x[2] ? 'Включил функцию' : 'Выключил функцию', x[1]); toast(x[1] + (x[2] ? ': включено' : ': выключено')); render(); return; }
    const nv = t.closest('[data-newver]'); if (nv) { const d = docs[+nv.dataset.newver]; const parts = d[1].slice(1).split('.'); d[1] = 'v' + parts[0] + '.' + (+parts[1] + 1); d[2] = new Date().toLocaleDateString('ru-RU'); logAct('Опубликовал новую версию', d[0] + ' ' + d[1]); toast(d[0] + ': опубликована ' + d[1]); render(); return; }
    if (t.closest('#add-cat')) { modal('<h3>Новая категория</h3><input class="inp" id="m-in" placeholder="Например: Заморозка"><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-mclose>Отмена</button><button class="btn" id="m-ok">Добавить</button></div>', () => { const v = $('#m-in').value.trim(); if (!v) return false; cats.push(v); logAct('Добавил категорию', v); toast('Категория добавлена'); render(); }); return; }
    if (t.closest('#add-staff')) { modal('<h3>Пригласить сотрудника</h3><div class="field"><label>Почта</label><input class="inp" id="m-in" type="email" placeholder="name@zakup.kg"></div><div class="field"><label>Роль</label><select class="inp" id="m-role"><option value="support">Поддержка</option><option value="moder">Модератор</option><option value="dev">Разработчик</option></select></div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-mclose>Отмена</button><button class="btn" id="m-ok">Пригласить</button></div>', () => { const v = $('#m-in').value.trim(); if (!v) return false; staff.push([v.split('@')[0], v, $('#m-role').value, 'приглашён']); logAct('Пригласил сотрудника', v); toast('Приглашение отправлено на ' + v); render(); }); return; }
    if (t.closest('#mk-reset')) { modal('<h3>Сбросить демо-данные?</h3><p class="small muted">Заказы, доставщики и каталог в приложении вернутся к начальным. Открытое приложение перезагрузится.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-mclose>Отмена</button><button class="btn red" id="m-ok">Сбросить</button></div>', () => { try { localStorage.removeItem(SHARED_KEY); } catch (e) {} logAct('Сбросил демо-данные', 'Приложение'); refresh(); toast('Демо-данные сброшены'); render(); }); return; }
    if (t.closest('#mk-test')) { companies.push({ id: companies.length + 1, type: 'shop', name: 'Тест «Магазин ' + (companies.length + 1) + '»', inn: '00000000000000', addr: 'тестовый адрес', st: 'ok', reg: new Date().toLocaleDateString('ru-RU'), staff: 1, orders: 0 }); logAct('Создал тестовую компанию', 'Тест «Магазин ' + companies.length + '»'); toast('Тестовая компания создана'); return; }
    if (t.closest('#t-close')) { const tk2 = tickets.find(x => x.id === curTicket); tk2.st = 'closed'; logAct('Закрыл обращение', '№ ' + tk2.id); toast('Обращение закрыто'); render(); return; }
  });
  $('#content').addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 't-reply') { const v = $('#t-text').value.trim(); if (!v) return; const tk = tickets.find(x => x.id === curTicket); tk.msgs.push([v, 'me', new Date().toTimeString().slice(0, 5)]); logAct('Ответил на обращение', '№ ' + tk.id + ', ' + coName(tk.co)); render(); toast('Ответ отправлен пользователю'); }
    if (e.target.id === 'push-form') { const v = $('#p-text').value.trim(); if (!v) { toast('Введите текст рассылки'); return; } pushes.unshift([v, $('#p-to').value, new Date().toLocaleDateString('ru-RU')]); logAct('Отправил рассылку', $('#p-to').value); toast('Рассылка отправлена'); render(); }
  });

  // ---------- Панель деталей ----------
  function drawer(head, body, foot) {
    $('#drawer-root').innerHTML = '<div class="drawer-bg" data-dclose></div><aside class="drawer" role="dialog" aria-modal="true"><div class="drawer-h"><div class="grow">' + head + '</div><button class="icon-btn" data-dclose aria-label="Закрыть">' + ic('i-x') + '</button></div><div class="drawer-b">' + body + '</div>' + (foot ? '<div class="drawer-f">' + foot + '</div>' : '') + '</aside>';
  }
  function closeDrawer() { $('#drawer-root').innerHTML = ''; }
  $('#drawer-root').addEventListener('click', e => { if (e.target.closest('[data-dclose]')) closeDrawer(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root').innerHTML) $('#modal-root').innerHTML = ''; else closeDrawer(); } });

  function modal(html, onOk) {
    $('#modal-root').innerHTML = '<div class="modal-bg" data-mclose><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
    const inp = $('#modal-root input, #modal-root textarea'); if (inp) inp.focus();
    $('#m-ok').onclick = () => { if (onOk() !== false) $('#modal-root').innerHTML = ''; };
  }
  $('#modal-root').addEventListener('click', e => { if (e.target.matches('[data-mclose]') || e.target.closest('button[data-mclose]')) $('#modal-root').innerHTML = ''; });
  const reasonModal = (title, btn, cls, cb) => modal('<h3>' + title + '</h3><div class="field"><label for="m-in">Причина</label><textarea class="inp" id="m-in" placeholder="Запишется в журнал действий"></textarea></div><span class="err" id="m-err" hidden>Укажите причину</span><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-mclose>Отмена</button><button class="btn ' + (cls || '') + '" id="m-ok">' + btn + '</button></div>', () => { const v = $('#m-in').value.trim(); if (!v) { $('#m-err').hidden = false; return false; } cb(v); });

  function openCompany(id) {
    const c = companies.find(x => x.id === id), emp = users.filter(u => u.co === id);
    const head = '<h3>' + esc(c.name) + '</h3><div class="row" style="margin-top:6px">' + coTag(c) + tag(c.type === 'dist' ? 'Поставщик' : 'Магазин', 'blue') + '</div>';
    let body = '<div class="sec"><h4>Реквизиты</h4><div class="kv"><span>ИНН</span><span class="mono">' + c.inn + '</span><span>Адрес</span><span>' + esc(c.addr) + '</span><span>Телефон</span><span class="mono">' + (can('seeFull') ? PHONE : MASK) + '</span><span>Регистрация</span><span>' + c.reg + '</span><span>Заказов</span><span>' + c.orders + '</span></div></div>' +
      (c.why ? '<div class="lock" style="background:var(--red-bg);color:var(--red)">' + ic('i-lock') + 'Заблокирована: ' + esc(c.why) + '</div>' : '') +
      '<div class="sec"><h4>Сотрудники</h4>' + (emp.length ? '<div class="list">' + emp.map(u => '<div><span class="grow cell2"><b>' + esc(u.name) + '</b><span>' + u.r + ', вход ' + u.last + '</span></span></div>').join('') + '</div>' : '<span class="muted small">Нет данных</span>') + '</div>';
    if (c.st === 'pending') body += '<div class="sec"><h4>Проверка</h4><div class="list"><div>' + ic('i-check', ' style="color:var(--green)"') + '<span class="grow">ИНН найден в базе налоговой</span></div><div>' + ic('i-check', ' style="color:var(--green)"') + '<span class="grow">Телефон подтверждён по SMS</span></div><div>' + ic('i-eye', ' style="color:var(--amber)"') + '<span class="grow">Адрес проверить по звонку</span></div></div></div>';
    let foot = '';
    if (can('verify') && c.st === 'pending') foot += '<button class="btn" id="d-verify">' + ic('i-check') + 'Подтвердить</button><button class="btn red ghost" id="d-reject">Отклонить</button>';
    if (can('block') && c.st === 'ok') foot += '<button class="btn red ghost" id="d-block">Заблокировать</button>';
    if (can('block') && c.st === 'blocked') foot += '<button class="btn ghost" id="d-unblock">Разблокировать</button>';
    if (!foot) foot = noAccess('Модератор или Владелец');
    drawer(head, body, foot);
    const done = (msg, act, why) => { logAct(act, c.name, why); toast(msg); render(); openCompany(id); };
    const b1 = $('#d-verify'); if (b1) b1.onclick = () => { c.st = 'ok'; done('Компания подтверждена, она уже может работать', 'Подтвердил компанию'); };
    const b2 = $('#d-reject'); if (b2) b2.onclick = () => reasonModal('Отклонить заявку?', 'Отклонить', 'red', v => { c.st = 'blocked'; c.why = v; done('Заявка отклонена, компания получит причину', 'Отклонил заявку', v); });
    const b3 = $('#d-block'); if (b3) b3.onclick = () => reasonModal('Заблокировать компанию?', 'Заблокировать', 'red', v => { c.st = 'blocked'; c.why = v; done('Компания заблокирована', 'Заблокировал компанию', v); });
    const b4 = $('#d-unblock'); if (b4) b4.onclick = () => reasonModal('Разблокировать компанию?', 'Разблокировать', '', v => { c.st = 'ok'; delete c.why; done('Компания разблокирована', 'Разблокировал компанию', v); });
  }

  function openOrder(n) {
    const o = orders.find(x => x.n === n);
    const head = '<h3>Заказ № ' + o.n + '</h3><div class="row" style="margin-top:6px">' + stTag(o) + '</div>';
    const body = '<div class="sec"><h4>Стороны</h4><div class="kv"><span>Магазин</span><span><button class="linkbtn" data-co2="' + o.shop + '">' + esc(coName(o.shop)) + '</button></span><span>Поставщик</span><span><button class="linkbtn" data-co2="' + o.sup + '">' + esc(coName(o.sup)) + '</button></span><span>Создан</span><span>' + o.ago + '</span><span>Поставка</span><span>' + (o.deliver || 'не назначена') + '</span>' + (o.courierName ? '<span>' + (o.st === 'done' ? 'Доставил' : 'Доставщик') + '</span><span>' + esc(o.courierName) + '</span>' : '') + '</div></div>' +
      '<div class="sec"><h4>Товары</h4><div class="list">' + o.items.map(([nm, q2, s]) => '<div><span class="grow cell2"><b>' + esc(nm) + '</b><span>' + q2 + '</span></span><span class="mono bold">' + fmt(s) + ' сом</span></div>').join('') + '<div><span class="grow bold">Итого</span><span class="mono bold">' + fmt(o.sum) + ' сом</span></div></div></div>' +
      '<div class="sec"><h4>История</h4><div class="timeline">' + o.hist.map(([t, w, k]) => '<div class="tl"><span class="dot' + (k === 'red' ? ' red' : k === 'grey' ? ' grey' : '') + '"></span><div class="cell2"><b>' + esc(t) + '</b><span>' + esc(w) + '</span></div></div>').join('') + (o.st === 'new' ? '<div class="tl"><span class="dot grey"></span><div class="cell2"><b>Ждём ответа поставщика</b><span>' + o.ago + '</span></div></div>' : '') + '</div></div>';
    let foot = '<button class="btn ghost" id="d-call">Связаться с поставщиком</button>';
    if (o.st !== 'done' && o.st !== 'rejected') foot += can('orderStatus') ? '<button class="btn red ghost" id="d-cancel">Отменить заказ</button>' : '';
    drawer(head, body, foot + (can('orderStatus') ? '' : noAccess('Владелец (смена статуса)')));
    $('#drawer-root .drawer').dataset.order = n;
    $('#d-call').onclick = () => { logAct('Связался с поставщиком', 'Заказ № ' + o.n); toast('Звонок поставщику: ' + (can('seeFull') ? PHONE : MASK)); };
    const c1 = $('#d-cancel'); if (c1) c1.onclick = () => reasonModal('Отменить заказ № ' + o.n + '?', 'Отменить заказ', 'red', v => {
      if (live) writeShared(d => { const x = d.orders.find(y => y.n === o.n); if (x) { x.st = 'rejected'; x.reason = v; x.byAdmin = true; delete x.urgent; } });
      else { o.st = 'rejected'; o.reason = v; o.byAdmin = true; buildHist(o); }
      logAct('Отменил заказ', '№ ' + o.n, v); toast(live ? 'Заказ отменён, приложение уже обновилось' : 'Заказ отменён, стороны получат уведомление'); render(); openOrder(n); });
  }
  $('#drawer-root').addEventListener('click', e => { const b = e.target.closest('[data-co2]'); if (b) openCompany(+b.dataset.co2); });

  function openUser(id) {
    const u = users.find(x => x.id === id);
    const head = '<h3>' + esc(u.name) + '</h3><div class="row" style="margin-top:6px">' + (u.st === 'ok' ? tag('Активен', 'green') : tag('Заблокирован', 'red')) + '</div>';
    const body = '<div class="sec"><h4>Профиль</h4><div class="kv"><span>Компания</span><span>' + esc(coName(u.co)) + '</span><span>Роль</span><span>' + u.r + '</span><span>Телефон</span><span class="row"><span class="mono" id="u-ph">' + (u.show ? PHONE : MASK) + '</span>' + (!u.show && can('seeFull') ? '<button class="linkbtn" id="u-show">' + 'Показать' + '</button>' : '') + '</span><span>Последний вход</span><span>' + u.last + '</span><span>Согласие на передачу за рубеж</span><span>' + (u.co === 2 ? 'отозвано 15.11.2026' : 'дано при регистрации') + '</span></div></div>' +
      '<div class="sec"><h4>Устройства</h4><div class="list"><div><span class="grow cell2"><b>iPhone 13</b><span>сейчас в приложении</span></span></div><div><span class="grow cell2"><b>Android, Samsung A54</b><span>12.11.2026</span></span></div></div></div>';
    let foot = can('resetPw') ? '<button class="btn ghost" id="u-reset">Сбросить пароль</button><button class="btn ghost" id="u-sess">Завершить сеансы</button>' + (u.st === 'ok' ? '<button class="btn red ghost" id="u-block">Заблокировать</button>' : '') : noAccess('Поддержка или Владелец');
    drawer(head, body, foot);
    const s = $('#u-show'); if (s) s.onclick = () => { u.show = true; logAct('Открыл полный телефон', u.name + ', ' + coName(u.co)); toast('Номер показан, действие записано в журнал'); render(); openUser(id); };
    const r = $('#u-reset'); if (r) r.onclick = () => { logAct('Сбросил пароль', u.name); toast('Ссылка для нового пароля отправлена по SMS'); };
    const se = $('#u-sess'); if (se) se.onclick = () => { logAct('Завершил сеансы', u.name); toast('Все сеансы завершены, нужен повторный вход'); };
    const bl = $('#u-block'); if (bl) bl.onclick = () => reasonModal('Заблокировать пользователя?', 'Заблокировать', 'red', v => { u.st = 'blocked'; logAct('Заблокировал пользователя', u.name, v); toast('Пользователь заблокирован'); render(); openUser(id); });
  }

  function openDataReq(id) {
    const d = dataReqs.find(x => x.id === id);
    const head = '<h3>Запрос № ' + d.id + '</h3><div class="row" style="margin-top:6px">' + tag(KIND[d.kind], 'blue') + (d.st === 'new' ? tag('Новый', 'amber') : tag('Выполнен', 'green')) + '</div>';
    const what = { del: 'Удалим профиль и обезличим имя и телефон в заказах и накладных. Сами заказы останутся для учёта.', export: 'Соберём все данные человека в файл: профиль, заказы, согласия, входы.', consent: 'Остановим передачу данных за рубеж. Если без неё сервис работать не может, предложим удалить профиль.', fix: 'Исправим данные по заявке и сообщим человеку.' }[d.kind];
    const body = '<div class="sec"><h4>Заявитель</h4><div class="kv"><span>Имя</span><span>' + esc(d.who) + '</span><span>Компания</span><span>' + esc(coName(d.co)) + '</span><span>Дата запроса</span><span>' + d.date + '</span></div></div><div class="sec"><h4>Что сделаем</h4><p class="small">' + what + '</p></div>';
    let foot = '';
    if (d.st === 'new') {
      if (d.kind === 'del') foot = can('dataDelete') ? '<button class="btn red" id="r-do">Удалить и обезличить</button>' : noAccess('Владелец');
      else if (d.kind === 'export') foot = can('dataExport') ? '<button class="btn" id="r-do">' + ic('i-download') + 'Выгрузить</button>' : noAccess('Поддержка или Владелец');
      else foot = '<button class="btn" id="r-do">Выполнить</button>';
    }
    drawer(head, body, foot);
    const b = $('#r-do'); if (b) b.onclick = () => {
      const fin = () => { d.st = 'done'; logAct(d.kind === 'del' ? 'Удалил данные' : d.kind === 'export' ? 'Выгрузил данные' : 'Выполнил запрос', d.who + ', запрос № ' + d.id); toast(d.kind === 'export' ? 'Файл с данными готов и отправлен заявителю' : 'Запрос выполнен'); render(); openDataReq(id); };
      if (d.kind === 'del') modal('<h3>Удалить данные?</h3><p class="small muted">Профиль ' + esc(d.who) + ' будет удалён, имя и телефон в заказах заменятся на «Удалённый пользователь». Отменить нельзя.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-mclose>Отмена</button><button class="btn red" id="m-ok">Удалить</button></div>', fin);
      else fin();
    };
  }
})();
</script>
</body>
</html>
