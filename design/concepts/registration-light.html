<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakup.KG — светлая версия</title>
    <style>
:root {
  --bg-dark: #0d1018;
  --surface: rgba(22, 29, 40, 0.96);
  --surface-soft: rgba(35, 47, 62, 0.7);
  --surface-strong: rgba(38, 49, 61, 0.9);
  --line: rgba(150, 174, 191, 0.22);
  --text: #e5ebf4;
  --muted: #b4c0d1;
  --brand: #00ff92;
  --brand-strong: #03f48d;
  --brand-glow: rgba(0, 255, 146, 0.7);
  --shadow: rgba(0, 0, 0, 0.28);
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #eef0f3;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
}

button,
input {
  font: inherit;
}

.phone-shell {
  width: 100%;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #e9ebee;
}

.phone {
  --content-shift: 54px;
  width: 402px;
  height: 874px;
  background: linear-gradient(180deg, #0d1018 0%, #0f1320 100%);
  box-shadow: 0 18px 42px rgba(10, 14, 21, 0.18);
  padding: 20px 24px 32px;
  color: var(--text);
  position: relative;
  overflow: hidden;
}

.phone::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(70, 242, 208, 0.08), transparent 32%);
  pointer-events: none;
}

.page-header,
.brand-wrap,
.welcome,
.role-toggle,
.registration-form,
.login-link {
  position: relative;
  z-index: 1;
}

.page-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 30px;
  margin-bottom: 18px;
}

.page-header h1 {
  font-size: 40px;
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.04em;
  font-weight: 700;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 18px;
  margin-bottom: 18px;
}

.brand-mark {
  position: relative;
  width: 56px;
  height: 44px;
  display: inline-block;
}

.bracket {
  position: absolute;
  width: 24px;
  height: 33px;
  border: 4px solid var(--brand);
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(51, 255, 214, 0.7);
}

.bracket-left {
  left: 0;
  border-right: none;
  border-radius: 8px 0 0 8px;
}

.bracket-right {
  right: 0;
  border-left: none;
  border-radius: 0 8px 8px 0;
}

.brand-name {
  font-size: 46px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.06em;
  color: #eefaf8;
}

.brand-name span {
  color: var(--brand);
  text-shadow: 0 0 12px rgba(51, 255, 214, 0.8);
}

.welcome {
  margin: 0 0 22px;
  font-size: 15px;
  color: rgba(218, 228, 239, 0.9);
  letter-spacing: 0.01em;
  margin-top: 4px;
}

.role-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: rgba(37, 49, 62, 0.9);
  border: 1px solid rgba(108, 129, 148, 0.25);
  border-radius: 18px;
  padding: 4px;
  height: 48px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}

.role-btn {
  border: 0;
  background: transparent;
  color: rgba(226, 233, 244, 0.8);
  border-radius: 14px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.role-btn.active {
  background: linear-gradient(180deg, rgba(74, 248, 212, 0.9), rgba(58, 226, 200, 0.9));
  box-shadow: 0 0 12px rgba(69, 241, 209, 0.75);
  color: #0d1018;
}

.role-btn:focus-visible,
.eye-btn:focus-visible,
.primary-btn:focus-visible,
.field input:focus-visible,
.checkbox-row input:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}

.registration-form {
  margin-top: 18px;
}

.field {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 54px;
  width: 100%;
  background: rgba(40, 53, 67, 0.9);
  border: 1px solid rgba(125, 138, 153, 0.2);
  border-radius: 16px;
  padding: 0 14px 0 12px;
  margin-bottom: 12px;
  color: var(--muted);
}

.field-icon {
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0.8;
  flex-shrink: 0;
}

.field-icon svg,
.eye-btn svg {
  width: 22px;
  height: 22px;
  fill: rgba(208, 220, 233, 0.86);
}

.field input {
  flex: 1;
  background: transparent;
  border: 0;
  outline: none;
  color: rgba(234, 239, 246, 0.92);
  font-size: 18px;
  letter-spacing: -0.02em;
  padding: 0;
}

.field input::placeholder {
  color: rgba(193, 206, 221, 0.75);
}

.country-code {
  color: rgba(233, 239, 245, 0.9);
  font-size: 17px;
  margin-right: 8px;
  font-weight: 600;
}

.field--password {
  position: relative;
}

.eye-btn {
  border: 0;
  background: transparent;
  margin-left: auto;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  cursor: pointer;
  opacity: 0.8;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0 22px;
  color: rgba(233, 239, 245, 0.9);
  font-size: 16px;
  font-weight: 500;
}

.checkbox-row input {
  appearance: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(161, 173, 188, 0.8);
  border-radius: 5px;
  background: transparent;
  position: relative;
  margin: 0;
}

.checkbox-row input:checked {
  background: var(--brand);
  border-color: var(--brand);
}

.checkbox-row input:checked::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 3.5px;
  border-left: 2px solid #0d1018;
  border-bottom: 2px solid #0d1018;
  transform: rotate(-45deg);
  left: 4px;
  top: 14px;
}

.primary-btn {
  width: 100%;
  height: 58px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(78, 252, 212, 0.95), rgba(46, 218, 180, 0.95));
  color: #111b20;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.03em;
  box-shadow: 0 0 18px rgba(70, 242, 208, 0.75);
  cursor: pointer;
  transition: transform 0.15s ease;
}

.primary-btn:active {
  transform: translateY(1px);
}

.login-link {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-top: 18px;
  font-size: 19px;
  font-weight: 500;
  color: rgba(235, 239, 247, 0.8);
}

.login-link a {
  color: #eefaf8;
  font-weight: 700;
  text-decoration: none;
  position: relative;
}

.login-link a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;
  height: 2px;
  background: rgba(255,255,255,0.8);
}

@media (max-width: 420px) {
  .phone {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }
}

/* Вписать макет 402px в ширину телефона (только для просмотра) */
html, body { overflow-x: hidden; }
body, .phone-shell { min-height: 0; display: block; }
.phone { margin: 0 auto; width: 402px !important; height: 874px !important; max-width: none !important; }
html, body { height: auto !important; overflow-y: auto !important; }
@media (max-width: 401px) { .phone { zoom: 0.97; } }
@media (max-width: 389px) { .phone { zoom: 0.93; } }
@media (max-width: 374px) { .phone { zoom: 0.89; } }
@media (max-width: 359px) { .phone { zoom: 0.79; } }
</style>
<script>
(function () {
  function fit() {
    var el = document.querySelector('.phone');
    if (!el) return;
    el.style.zoom = Math.min(1, window.innerWidth / 402);
  }
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', fit);
  fit();
})();
</script>

              </svg>
            </span>
            <input type="text" placeholder="Название магазина" required />
          </label>

          <label class="field" aria-label="ИНН / ПИН">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zm0 2v9h10v-9H7zm2 2h6v2H9v-2zm0 4h4v2H9v-2z"/></svg>
            </span>
            <input
              type="text"
              placeholder="ИНН / ПИН"
              inputmode="numeric"
              pattern="[0-9]{14}"
              data-digits-only
              data-max-digits="14"
              data-exact-digits="14"
              required
            />
          </label>

          <label class="field" aria-label="Адрес магазина / доставки">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a7.5 7.5 0 0 1 7.5 7.5c0 5.63-7.5 11.5-7.5 11.5S4.5 15.63 4.5 10A7.5 7.5 0 0 1 12 2.5zm0 2.2a5.3 5.3 0 0 0-5.3 5.3c0 3.42 4.1 7.48 5.3 8.52 1.2-1.04 5.3-5.1 5.3-8.52A5.3 5.3 0 0 0 12 4.7zm0 2.3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
            </span>
            <input type="text" placeholder="Адрес магазина / доставки" required />
          </label>

          <label class="field" aria-label="Номер телефона">
            <span class="field-icon" aria-hidden="true">
              <svg class="field-icon-svg--outline" viewBox="0 0 28 28" aria-hidden="true">
                <path d="M8.2 3.8 4.8 6.3c-.9.7-1.3 1.9-.9 3 2.2 7.3 7.5 12.6 14.8 14.8 1.1.3 2.3 0 3-.9l2.5-3.4-5.6-4.1-3 2.3a16.2 16.2 0 0 1-5.4-5.4l2.3-3-4.3-5.8Z" />
              </svg>
            </span>
            <span class="country-code">+996</span>
            <input
              type="text"
              placeholder="Номер телефона"
              inputmode="numeric"
              pattern="[0-9]{3} [0-9]{3} [0-9]{3}"
              maxlength="11"
              data-phone-format
              data-max-digits="9"
              required
            />
          </label>

          <label class="field" aria-label="Придумайте пароль">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v10h14V9h-2zm-8 0V7a3 3 0 1 1 6 0v2H9zm7 8H8v-6h8v6z"/></svg>
            </span>
            <input id="registration-password" type="password" placeholder="Придумайте пароль" minlength="8" required />
          </label>

          <label class="field field--password" aria-label="Повторите пароль">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v10h14V9h-2zm-8 0V7a3 3 0 1 1 6 0v2H9zm7 8H8v-6h8v6z"/></svg>
            </span>
            <input id="registration-password-confirm" type="password" placeholder="Повторите пароль" minlength="8" required />
            <button class="eye-btn" type="button" aria-label="Показать оба пароля" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2 9.6 2 12c0 2.4 4.5 7 10 7s10-4.6 10-7c0-2.4-4.5-7-10-7zm0 2.1c3.89 0 6.97 3.39 8.16 4.9-1.19 1.51-4.27 4.9-8.16 4.9-3.89 0-6.97-3.39-8.16-4.9C5.03 10.49 8.11 7.1 12 7.1zm0 2.4a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>
            </button>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" required />
            <span>Согласен с условиями использования</span>
          </label>

          <button class="primary-btn" type="submit">Войти</button>
        </form>

        <form class="login-panel" aria-label="Вход" hidden>
          <label class="field" aria-label="Номер телефона">
            <span class="field-icon" aria-hidden="true">
              <svg class="field-icon-svg--outline" viewBox="0 0 28 28" aria-hidden="true">
                <path d="M8.2 3.8 4.8 6.3c-.9.7-1.3 1.9-.9 3 2.2 7.3 7.5 12.6 14.8 14.8 1.1.3 2.3 0 3-.9l2.5-3.4-5.6-4.1-3 2.3a16.2 16.2 0 0 1-5.4-5.4l2.3-3-4.3-5.8Z" />
              </svg>
            </span>
            <span class="country-code">+996</span>
            <input
              type="text"
              placeholder="Номер телефона"
              inputmode="numeric"
              pattern="[0-9]{3} [0-9]{3} [0-9]{3}"
              maxlength="11"
              data-phone-format
              data-max-digits="9"
              required
            />
          </label>

          <label class="field field--password" aria-label="Пароль">
            <input type="password" placeholder="Пароль" minlength="8" required />
            <button class="eye-btn login-eye" type="button" aria-label="Показать пароль" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2 9.6 2 12c0 2.4 4.5 7 10 7s10-4.6 10-7c0-2.4-4.5-7-10-7zm0 2.1c3.89 0 6.97 3.39 8.16 4.9-1.19 1.51-4.27 4.9-8.16 4.9-3.89 0-6.97-3.39-8.16-4.9C5.03 10.49 8.11 7.1 12 7.1zm0 2.4a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>
            </button>
          </label>

          <div class="login-actions">
            <button class="forgot-password-link" type="button">Забыли пароль?</button>
            <button class="login-register-button" type="button">Зарегистрироваться</button>
          </div>
          <button class="primary-btn" type="submit">Войти</button>
        </form>

        <p class="form-status" role="status" aria-live="polite"></p>

        <div class="login-link">
          <span>Уже есть аккаунт ?</span>
          <a href="#">Войти</a>
        </div>
      </div>
    </div>
    <script>
      const password = document.getElementById("registration-password");
      const passwordConfirm = document.getElementById("registration-password-confirm");

      document.querySelectorAll("[data-digits-only]").forEach((input) => {
        input.addEventListener("input", () => {
          const maxDigits = Number(input.dataset.maxDigits);
          input.value = input.value.replace(/\D/g, "").slice(0, maxDigits);
          const exactDigits = Number(input.dataset.exactDigits);
          input.setCustomValidity(
            input.value.length > 0 && input.value.length !== exactDigits
              ? `Введите ровно ${exactDigits} цифр`
              : "",
          );
        });
      });

      document.querySelectorAll("[data-phone-format]").forEach((phoneInput) => {
        phoneInput.addEventListener("input", () => {
          const caret = phoneInput.selectionStart;
          const digitsBeforeCaret = phoneInput.value.slice(0, caret).replace(/\D/g, "").length;
          const digits = phoneInput.value.replace(/\D/g, "").slice(0, 9);
          phoneInput.value = digits.replace(/(\d{3})(?=\d)/g, "$1 ");
          const formattedCaret = phoneInput.value
            .split("")
            .reduce((position, character, index) => {
              if (/\d/.test(character) && position.digits < digitsBeforeCaret) {
                return { digits: position.digits + 1, index: index + 1 };
              }
              return position;
            }, { digits: 0, index: 0 }).index;
          phoneInput.setSelectionRange(formattedCaret, formattedCaret);
          phoneInput.setCustomValidity(
            digits.length > 0 && digits.length !== 9 ? "Введите ровно 9 цифр" : "",
          );
        });

        phoneInput.addEventListener("blur", () => {
          if (phoneInput.value) {
            phoneInput.value = phoneInput.value.replace(/\D/g, "").replace(/(\d{3})(?=\d)/g, "$1 ");
          }
        });
      });

      document.querySelector(".registration-form .eye-btn").addEventListener("click", (event) => {
        const button = event.currentTarget;
        const isVisible = password.type === "text";
        [password, passwordConfirm].forEach((input) => {
          input.type = isVisible ? "password" : "text";
        });
        button.setAttribute("aria-pressed", String(!isVisible));
        button.setAttribute("aria-label", isVisible ? "Показать оба пароля" : "Скрыть оба пароля");
        button.classList.toggle("is-visible", !isVisible);
      });

      const form = document.querySelector(".registration-form");
      const loginPanel = document.querySelector(".login-panel");
      const formStatus = document.querySelector(".form-status");
      const pageTitle = document.getElementById("page-title");
      const welcomeMessage = document.getElementById("welcome-message");
      const shopName = form.querySelector('[placeholder="Название магазина"]');
      const address = form.querySelector('[placeholder="Адрес магазина / доставки"]');
      const accountType = form.querySelector('[name="accountType"]');

      const showRegistration = () => {
        document.querySelector(".phone").classList.remove("is-login");
        form.hidden = false;
        loginPanel.hidden = true;
        document.querySelector(".role-toggle").hidden = false;
        document.querySelector(".login-link").hidden = false;
        pageTitle.textContent = "Регистрация";
        welcomeMessage.textContent = "Добро пожаловать в B2B платформу!";
        formStatus.textContent = "";
      };

      const showLogin = () => {
        document.querySelector(".phone").classList.add("is-login");
        form.hidden = true;
        loginPanel.hidden = false;
        document.querySelector(".role-toggle").hidden = false;
        document.querySelector(".login-link").hidden = true;
        pageTitle.textContent = "Вход";
        welcomeMessage.textContent = "Добро пожаловать!";
        formStatus.textContent = "";
      };

      document.querySelector(".login-link a").addEventListener("click", (event) => {
        event.preventDefault();
        showLogin();
      });
      document.querySelector(".login-register-button").addEventListener("click", showRegistration);
      document.querySelector(".login-eye").addEventListener("click", (event) => {
        const button = event.currentTarget;
        const input = loginPanel.querySelector('[placeholder="Пароль"]');
        const isVisible = input.type === "text";
        input.type = isVisible ? "password" : "text";
        button.setAttribute("aria-pressed", String(!isVisible));
        button.setAttribute("aria-label", isVisible ? "Показать пароль" : "Скрыть пароль");
        button.classList.toggle("is-visible", !isVisible);
      });
      document.querySelector(".forgot-password-link").addEventListener("click", () => {
        formStatus.textContent = "Восстановление пароля пока не подключено.";
      });

      document.querySelectorAll("[data-account-type]").forEach((tab) => {
        tab.addEventListener("click", () => {
          const isShop = tab.dataset.accountType === "shop";
          document.querySelectorAll("[data-account-type]").forEach((item) => {
            const isSelected = item === tab;
            item.classList.toggle("active", isSelected);
            item.setAttribute("aria-selected", String(isSelected));
          });
          accountType.value = tab.dataset.accountType;
          shopName.placeholder = isShop ? "Название магазина" : "Название поставщика";
          shopName.parentElement.setAttribute(
            "aria-label",
            isShop ? "Название магазина" : "Название поставщика",
          );
          address.placeholder = isShop
            ? "Адрес магазина / доставки"
            : "Адрес склада / доставки";
          address.parentElement.setAttribute(
            "aria-label",
            isShop ? "Адрес магазина / доставки" : "Адрес склада / доставки",
          );
          formStatus.textContent = "";
        });
      });

      const validatePasswordConfirm = () => {
        passwordConfirm.setCustomValidity(
          passwordConfirm.value && passwordConfirm.value !== password.value
            ? "Пароли не совпадают"
            : "",
        );
      };

      password.addEventListener("input", validatePasswordConfirm);
      passwordConfirm.addEventListener("input", validatePasswordConfirm);

      form.addEventListener("input", () => {
        formStatus.textContent = "";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        form.classList.add("was-validated");
        validatePasswordConfirm();
        if (!form.reportValidity()) {
          formStatus.textContent = "";
          return;
        }
        formStatus.textContent =
          "Данные проверены. Отправка регистрации пока не подключена.";
      });

      loginPanel.addEventListener("input", () => {
        formStatus.textContent = "";
      });

      loginPanel.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!loginPanel.reportValidity()) {
          formStatus.textContent = "";
          return;
        }
        formStatus.textContent = "Данные проверены. Авторизация пока не подключена.";
      });
    </script>
  </body>
</html>
